<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kickstart Your Training</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
  @font-face {
    font-family: 'Varet Gothic';
    src: url('VaretGothic-BoldItalic.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Lato', sans-serif;
    margin: 0;
    padding: 0;
    background: #222323;
    color: #ffffff;
    overflow-x: hidden;
  }
  .slider {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
  }
  .slide {
    flex: 0 0 100%;
    height: 100vh;
    padding: 2rem;
    scroll-snap-align: start;
    background: #2c2d2d;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  h1, h2 {
    font-family: 'Varet Gothic', sans-serif;
    color: #ffcd68;
    margin: 0.5rem 0;
    text-transform: uppercase; 
    font-weight: normal;
    max-width: 600px;
    font-size: 1.5rem;      /* Reduced from 2rem */
    line-height: 1.05;      /* Slightly tighter */
  }
  h1 {
    font-weight: bold;
    font-size: 1.5rem;      /* Slightly smaller */
  }
  h2 {
    font-weight: normal;
    font-size: 1.2rem;      /* Slightly smaller */
  }
  h3 {
    font-family: 'Lato', sans-serif;
    font-size: 1.5rem;
    font-weight: normal;
    max-width: 600px;
  }
  p, ul, ol {
    max-width: 600px;
    line-height: 1.6;
    font-size: 0.95rem; /* Smaller body text */
  }
  ul, ol {
    padding-left: 0;
    list-style-type: none;
  }
  ul li, ol li {
    margin-bottom: 0.5rem;
  }
  a { color: #BF994C; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .indicators {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #464646;
  }
  .dot.active { background-color: #BF994C; }
  .progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background-color: #BF994C;
    width: 0%;
    z-index: 10;
  }
  .nav-buttons {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }
  .nav-button {
    font-size: 2rem;
    background: none;
    border: none;
    color: #BF994C;
    cursor: pointer;
  }
  .app-links {
    margin-top: 2rem;
  }
  .pill-button {
    display: inline-block;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    background-color: #BF994C;
    color: #222323;
    margin: 0.25rem;
    font-weight: bold;
    text-decoration: none;
  }
  .pill-button:hover { background-color: #ffcd68; }
  strong { color: #ffcd68; }
  .responsive-img {
    width: 80%;
    max-width: 400px;
    margin: 1rem 0;
    height: auto;
    display: block;
  }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBarEl"></div>
  <div class="slider" id="slider"></div>
  <div class="indicators" id="indicators"></div>
  <script>
  const slides = [
    `<img src="images/wave.png" alt="wave" style="width:120px; margin:1rem 0;">
     <h1>Welcome to my super simple, no-bullshit guide to kickstarting your training.</h1>
     <p>This will take you about 5–10 minutes to run through, so grab a fun drink and dig in 🥤</p>`,

    `<img src="images/idea.png" alt="idea" style="width:112px; margin:1rem 0;">
     <h2>This guide covers all the essential ‘need to know’ info for first-time gym-goers, so you can read your workout programming without feeling like a sad lost little boy.</h2>
     <p>I’ve got deeper dives on these topics in the app’s resource section if you want to know more.</p>
     <img src="images/resources.png" alt="resources" class="responsive-img">
     <p>But here, I’m giving you just the essentials so you can dive in straight away!</p>`,

    `<img src="images/laptop.png" alt="laptop" style="width:140px; margin:1rem 0;">
     <h2>Your Mission: Have a read through the next few slides and let me know if you have any questions!</h2>
     <p>If you’re a 121 or Fast & Ferocious team member, DM me directly.</p>
     <p>If you’re on one of my Superhuman workout programs, post your questions in the <a href="https://t.me/+kdwwAjIYEf9hOGRk" target="_blank" style="color:#ffcd68; font-weight:bold;">Telegram Community Group</a>.</p>`,

    `<img src="images/shrug.png" alt="shrug" style="width:140px; margin:1rem 0;">
     <h2>Why is this so important, Lucinda?</h2>
     <p>If you know how to read workout programming, you won’t have to second-guess anything during your session.</p>
     <p style="color:#ffcd68;">It won’t be another barrier to training, and you won’t be leaving any gains on the table because you’re executing the sessions exactly as they were intended.</p>
     <p>The best part? This stuff is pretty standard everywhere, so spend 5 minutes with me now and you’ll be sorted for life 😉</p>`,

    `<h2>We break workout programming down into these five categories:</h2>
     <p>🔂 Reps</p>
     <p>🔁 Sets</p>
     <p>😴 Rest</p>
     <p>💨 Tempo</p>
     <p>🔥 Intensity</p>`,

    `<h2>🔂 Reps</h2>
     <p>How many repetitions of an exercise you do in a row.</p>
     <img src="images/reps.png" alt="reps" class="responsive-img">
     <p style='color:#ffcd68;'>Example: 8–12 x Incline Dumbbell Press</p>`,

    `<h2>🔁 Sets</h2>
     <p>A group of reps performed together, usually with a rest period in between.</p>
     <img src="images/sets.png" alt="sets" class="responsive-img">
     <p style='color:#ffcd68;'>Example: 3 x 8–12 x Incline Dumbbell Press</p>`,

    `<h2>😴 Rest</h2>
     <p>The time you spend recovering after and between sets.</p>
     <img src="images/rest.png" alt="rest" class="responsive-img">
     <p style='color:#ffcd68;'>Example: 3 x 8–12 x Incline Dumbbell Press<br>90s rest</p>`,

    `<h2>💨 Tempo</h2>
     <p>The speed you move the weight through each part of a lift—lifting, pausing, and lowering.</p>
     <img src="images/tempo.png" alt="tempo" class="responsive-img">
     <p style='color:#ffcd68;'>Example: 3 x 8–12 x Incline Dumbbell Press<br>2121 tempo – 90s rest</p>
     <p><i>💡 There’s a more detailed video on tempo in the resources section if you want to learn more!</i></p>`,

    `<h2>🔥 Intensity</h2>
     <p>How challenging your workout or exercise should feel.<br>
     We use Reps In Reserve (RIR) and Rate of Perceived Exertion (RPE) for this.</p>
     <img src="images/intensity.png" alt="intensity" class="responsive-img">
     <p style='color:#ffcd68;'>Example: 3 x 8–12 x Incline Dumbbell Press<br>2121 tempo – RPE 9 – 90s rest</p>
     <p><i>💡 There’s a video on intensity in the resources section too!</i></p>`,

    `<h2>👽 Other Jargon You Might Stumble Across In Your Sessions</h2>
     <img src="images/extras.png" alt="extras" class="responsive-img">
     <p>🦹🏼 Supersets: Exercises done one after another with no rest.</p>
     <p>💯 Failure Sets: Labeled ‘F’—do as many reps as you can until muscle failure.</p>
     <p>❤️‍🔥 AMRAPs: ‘As Many Rounds (or reps) As Possible’, usually within a time limit.</p>`,

    `<img src="images/cute.png" alt="cute" style="width:120px; margin:1rem 0;">
     <h2>😎 Final Tip</h2>
     <p>🚨 Read the workout notes... please! 🚨</p>`,

    `<h2>📝 I use workout notes to share key tips or highlight important info.</h2>
     <img src="images/workout-notes.png" alt="workout-notes" class="responsive-img">
     <p>Sometimes I’ll explain why we’re doing something, so you know the purpose behind the work.</p>
     <p style='color:#ffcd68;'>If you skip the workout notes, it’s like showing up to a movie 30 minutes late. You’ll get the gist, but not the full picture.</p>
     <p>🤡 Don’t be a clown… always read your workout notes!</p>`,

    `<h2>📱 Everfit App Guide</h2>
     <img src="images/client-app.png" alt="client-app" class="responsive-img">
     <p>My app is pretty intuitive, but if you ever get stuck, the guide is super handy.<br>
     Click the button below to check it out, or bookmark it for later ⤵️</p>
     <div class='app-links'><button class="pill-button" href="https://help.everfit.io/en/collections/2079376-client-app" target="_blank">Everfit Guide</button></div>`,

    `<img src="images/heart.png" alt="heart-eyes" style="width:120px; margin:1rem 0;">
     <h2 style='color:#ffcd68;'>And that, my lovely friends, is how you read workout programming like a champ. Happy training!</h2>
     <p>Lift weights, do crime, etc.</p>
     <h2>💜</h2>
     <div class='app-links'><button class="pill-button" onclick="smoothScrollTo(document.getElementById('slider'), 0, 700)">Back To The Start</button></div>`
  ];

  const slider = document.getElementById('slider');
  const indicators = document.getElementById('indicators');

  // Custom smooth scroll function
  function smoothScrollTo(element, target, duration = 700) {
    const start = element.scrollLeft;
    const change = target - start;
    const startTime = performance.now();

    function animateScroll(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      element.scrollLeft = start + change * progress;
      if (progress < 1) {
        requestAnimationFrame(animateScroll);
      }
    }
    requestAnimationFrame(animateScroll);
  }

  slides.forEach((html, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    if (i < slides.length - 1) {
      let navButtons = `
        <div class="nav-buttons">
          ${i > 0 ? `<button class="nav-button" aria-label="Previous slide" onclick="smoothScrollTo(document.getElementById('slider'), document.getElementById('slider').clientWidth * ${i - 1}, 700)">⬅️</button>` : ''}
          <button class="nav-button" aria-label="Next slide" onclick="smoothScrollTo(document.getElementById('slider'), document.getElementById('slider').clientWidth * ${i + 1}, 700)">➡️</button>
        </div>
      `;
      // Add the sentence only on the first slide
      if (i === 0) {
        navButtons += `<div style="margin-top:0.5rem;"><span style="font-style:italic;font-size:0.75rem;">Swipe through at your leisure bestie!</span></div>`;
      }
      slide.innerHTML = html + navButtons;
    } else {
      slide.innerHTML = html;
    }
    slider.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot';
    indicators.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');
  slider.addEventListener('scroll', () => {
    const index = Math.round(slider.scrollLeft / slider.clientWidth);
    const progress = ((index + 1) / slides.length) * 100;
    document.getElementById('progressBarEl').style.width = `${progress}%`;
    dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
  });
  </script>
</body>
</html>
